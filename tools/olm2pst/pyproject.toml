[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "olm2pst"
version = "0.1.0"
description = "Convert Outlook for Mac archives (.olm) to PST for Outlook on Windows, or to EML/MBOX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
olm2pst = "olm2pst.cli:main"

[tool.setuptools]
packages = ["olm2pst", "olm2pst.pst"]
