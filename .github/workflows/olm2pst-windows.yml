name: olm2pst Windows build

on:
  push:
    paths:
      - "tools/olm2pst/**"
      - ".github/workflows/olm2pst-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/olm2pst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libpff for independent PST reading (optional)
        run: python -m pip install libpff-python
        continue-on-error: true
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Command-line smoke test
        shell: pwsh
        run: |
          python tests/fixture.py "$env:RUNNER_TEMP\sample.olm"
          python -m olm2pst "$env:RUNNER_TEMP\sample.olm" --list
          python -m olm2pst "$env:RUNNER_TEMP\sample.olm" -o "$env:RUNNER_TEMP\sample.pst"
          python tests/verify_pst.py "$env:RUNNER_TEMP\sample.pst"
      - name: Build executables
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --onefile --windowed --name OLM2PST --paths . windows/gui_main.py
          python -m PyInstaller --noconfirm --onefile --console --name olm2pst --paths . windows/cli_main.py
          .\dist\olm2pst.exe "$env:RUNNER_TEMP\sample.olm" -o "$env:RUNNER_TEMP\exe.pst"
          python tests/verify_pst.py "$env:RUNNER_TEMP\exe.pst"
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: olm2pst-windows
          path: tools/olm2pst/dist/*
